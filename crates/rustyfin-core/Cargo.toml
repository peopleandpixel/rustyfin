[package]
name = "rustyfin-core"
version.workspace = true
edition.workspace = true

[dependencies]
rustyfin-model = { workspace = true }
rustyfin-db = { workspace = true }
rustyfin-auth = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }
blurhash = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
libc = "0.2.191"
libloading = "0.9"
# The bundled SQLite that sqlx already builds, for `sqlite3_limit` (jellyfin_import). No features of
# its own, so the build is unchanged, and sqlx-sqlite's version range, so it moves with sqlx.
libsqlite3-sys = { version = ">=0.30.1, <0.38.0", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
dashmap = "6"
moka = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
axum = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", default-features = false }
