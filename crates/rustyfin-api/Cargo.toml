[package]
name = "rustyfin-api"
version.workspace = true
edition.workspace = true

[features]
default = ["webclient"]
webclient = []

[dependencies]
rustyfin-model = { workspace = true }
rustyfin-db = { workspace = true }
rustyfin-auth = { workspace = true }
rustyfin-core = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-core = "0.1"
thiserror = { workspace = true }
tower-http = { workspace = true }
moka = { workspace = true }
reqwest = { workspace = true }
openidconnect = { workspace = true }
# B21: the ID token's claims are read as JSON, so the payload is decoded here.
base64 = "0.22"
futures-util = "0.3"
dashmap = "6"
ipnet = "2"
form_urlencoded = "1"
unicode-normalization = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true }
rustyfin-db = { workspace = true }
rustyfin-auth = { workspace = true }
rustyfin-core = { workspace = true }
uuid = { workspace = true }
# B21: the OIDC tests run a fake provider that signs ID tokens.
hmac = "0.12"
p256 = "0.14"
sha2 = "0.10"
url = "2"
