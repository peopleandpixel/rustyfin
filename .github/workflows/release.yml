name: Release

on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux: cross-compile from Linux using cross
  build-cross:
    name: Cross ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crates/rustyfin-web/package-lock.json

      - name: Build web client
        run: |
          cd crates/rustyfin-web
          npm install
          npm run build

      - name: Install cross
        run: cargo install cross

      - name: Build ${{ matrix.target }}
        run: cross build --release --target ${{ matrix.target }} --bin rustyfin

      - name: Package artifact
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          STAGING="release-${TARGET}"
          mkdir -p "$STAGING"

          # Copy binary
          if [[ "$TARGET" == *"windows"* ]]; then
            cp "target/${TARGET}/release/rustyfin.exe" "$STAGING/"
          else
            cp "target/${TARGET}/release/rustyfin" "$STAGING/"
          fi

          # Copy web client
          if [ -d "crates/rustyfin-web/dist" ]; then
            mkdir -p "$STAGING/web"
            cp -r crates/rustyfin-web/dist/* "$STAGING/web/"
          fi

          # Create archive
          if [[ "$TARGET" == *"windows"* ]]; then
            7z a "$STAGING.zip" "$STAGING/*" -r
            mv "$STAGING.zip" "${{ github.event.repository.name }}-${TARGET}.zip"
            echo "artifact=${{ github.event.repository.name }}-${TARGET}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${{ github.event.repository.name }}-${TARGET}.tar.gz" "$STAGING/"
            echo "artifact=${{ github.event.repository.name }}-${TARGET}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.artifact }}

  # Windows: cross-compile from Linux using cargo-xwin
  build-windows:
    name: Windows x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crates/rustyfin-web/package-lock.json

      - name: Build web client
        run: |
          cd crates/rustyfin-web
          npm install
          npm run build

      - name: Install LLVM and clang
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-xwin
        run: cargo install --locked cargo-xwin

      - name: Build Windows binary
        run: cargo xwin build --release --target x86_64-pc-windows-msvc --bin rustyfin

      - name: Package artifact
        shell: bash
        run: |
          TARGET="x86_64-pc-windows-msvc"
          STAGING="release-${TARGET}"
          mkdir -p "$STAGING"

          # cargo-xwin puts output in target/<target>/release/
          cp "target/${TARGET}/release/rustyfin.exe" "$STAGING/"

          # Copy web client
          if [ -d "crates/rustyfin-web/dist" ]; then
            mkdir -p "$STAGING/web"
            cp -r crates/rustyfin-web/dist/* "$STAGING/web/"
          fi

          # Create zip archive
          7z a "$STAGING.zip" "$STAGING/*" -r
          mv "$STAGING.zip" "${{ github.event.repository.name }}-${TARGET}.zip"
          echo "artifact=${{ github.event.repository.name }}-${TARGET}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.artifact }}

  # macOS: native build on macOS runner (cross cannot cross-compile to macOS)
  build-macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crates/rustyfin-web/package-lock.json

      - name: Build web client
        run: |
          cd crates/rustyfin-web
          npm install
          npm run build

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }} --bin rustyfin

      - name: Package artifact
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          STAGING="release-${TARGET}"
          mkdir -p "$STAGING"

          cp "target/${TARGET}/release/rustyfin" "$STAGING/"

          # Copy web client
          if [ -d "crates/rustyfin-web/dist" ]; then
            mkdir -p "$STAGING/web"
            cp -r crates/rustyfin-web/dist/* "$STAGING/web/"
          fi

          tar czf "${{ github.event.repository.name }}-${TARGET}.tar.gz" "$STAGING/"
          echo "artifact=${{ github.event.repository.name }}-${TARGET}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.artifact }}
