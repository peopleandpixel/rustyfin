name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    # The Debian release of the image's builder and runtime stages
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      # ffmpeg as the image installs it, zstd so the Rust cache isn't gzipped, nodejs for the
      # web client's logic tests that api_tests runs, and rustfmt and clippy, which the image's
      # minimal rustup profile leaves out
      - name: Install ffmpeg, zstd, nodejs, rustfmt and clippy
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg zstd nodejs
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # $CARGO_HOME/bin holds the image's toolchain; nothing is cargo-installed
          cache-bin: "false"
      # A test that can't run here skips itself and passes, and libtest hides a passing test's
      # output. Tests that lock a folder skip if they can still read it, as root can;
      # BrowseDirectories lists only roots such as /home; the media tests need ffmpeg and
      # ffprobe, and the web client tests node. So cargo runs as ci, with its home in /home/ci, and this step fails unless ci
      # meets all of that. runuser lowers the soft limit on open files to 1024 before its PAM
      # session, whose pam_limits then applies ci.conf, so cargo gets 65536 as on a bare runner.
      - name: Add a user that isn't root and check what the tests need
        run: |
          useradd --create-home ci
          chown -R ci: . /usr/local/cargo
          echo 'ci soft nofile 65536' > /etc/security/limits.d/ci.conf
          mkdir /tmp/locked
          touch /tmp/locked/file
          chmod 000 /tmp/locked
          runuser -u ci -- sh -e <<'EOF'
          if ls /tmp/locked || stat /tmp/locked/file; then
            echo "::error::ci can read a folder with mode 000 or stat a file in it, so tests would skip"
            exit 1
          fi
          case $HOME in
            /home/?*) ;;
            *) echo "::error::HOME is ${HOME:-unset}, not under /home, so a test would skip"; exit 1 ;;
          esac
          for tool in ffmpeg ffprobe; do
            "$tool" -version </dev/null >/dev/null || { echo "::error::$tool -version fails, so tests would skip"; exit 1; }
          done
          node --version </dev/null >/dev/null || { echo "::error::node --version fails, so the web client tests would fail"; exit 1; }
          [ "$(ulimit -n)" -ge 65536 ] || { echo "::error::ci may open only $(ulimit -n) files, not 65536"; exit 1; }
          echo "ci: HOME $HOME, $(ulimit -n) open files, $(command -v ffmpeg), $(command -v ffprobe), node $(node --version)"
          EOF
          rm -r /tmp/locked
      - name: Format check
        run: runuser -u ci -- cargo fmt --all -- --check
      - name: Clippy
        run: runuser -u ci -- cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: runuser -u ci -- cargo test --workspace
      - name: Build release
        run: runuser -u ci -- cargo build --release --locked --bin rustyfin
      - uses: actions/upload-artifact@v4
        with:
          name: rustyfin
          path: target/release/rustyfin
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Corepack provides the pnpm version pinned in package.json (packageManager), as in the Dockerfile
      - name: Build
        working-directory: crates/rustyfin-web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: crates/rustyfin-web/dist
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The Dockerfile's prebuilt target copies these instead of building from source
      - uses: actions/download-artifact@v4
        with:
          name: rustyfin
          path: prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: prebuilt/web
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      # Pull requests only check that the image builds
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max